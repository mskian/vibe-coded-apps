name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  workflow_run:
    workflows: ["Verify APKs and Update README"]
    branches: ["main"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check_bot.outputs.should_deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Check if bot updated README.md
        id: check_bot
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          head_sha="$(git rev-parse HEAD)"
          trigger_sha="${{ github.event.workflow_run.head_sha }}"
          author="$(git log -1 --format='%an')"
          changed_files="$(git diff-tree --no-commit-id --name-only -r HEAD)"

          if [ "$head_sha" != "$trigger_sha" ] && \
             [ "$author" = "github-actions[bot]" ] && \
             echo "$changed_files" | grep -qx "README.md"; then
            echo "Bot updated README.md — proceeding with deployment."
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new README.md commit from github-actions[bot] — skipping deployment."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
