name: Verify APKs and update README

on:
  push:
    paths:
      - 'apks/**.apk'
      - '.github/workflows/verify-apks.yml'
      - 'README.md'
  pull_request:
    paths:
      - 'apks/**.apk'
      - '.github/workflows/verify-apks.yml'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Verify APKs and generate README table
        shell: bash
        env:
          EXPECTED_CERT_SHA256: ${{ vars.EXPECTED_CERT_SHA256 }}
        run: |
          set -uo pipefail
          shopt -s nullglob
          apks=(apks/*.apk)
          if (( ${#apks[@]} == 0 )); then
            echo 'No APK files found in apks/' >&2
            exit 1
          fi

          failed=0
          table=$(mktemp)
          summary="$RUNNER_TEMP/apk-summary.md"
          printf '| App | Description | Version | Signing certificate SHA-256 | Download |\n|---|---|---:|---|---|\n' > "$table"
          printf '## APK signature verification\n\n| APK | Version | Signature | SHA-256 signer certificate |\n|---|---:|---|---|\n' > "$summary"

          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          for apk in "${apks[@]}"; do
            filename=$(basename "$apk")
            case "$filename" in
              fithr-release-signed.apk) app='FitHR'; description='Heart-rate companion and monitoring tools.' ;;
              sancraft-release-signed.apk) app='SanCraft'; description='Create and customize quote/kavithai images.' ;;
              RandomWords-release-signed.apk) app='Random Words'; description='Discover a random word and its meaning.' ;;
              tamilsms-release-signed.apk) app='Tamil SMS'; description='Tamil words and message inspiration.' ;;
              Fitsteps-release-signed.apk) app='Fitsteps'; description='Step tracking and activity tools.' ;;
              SanFit-release-signed.apk) app='SanFit'; description='Fitness and activity companion.' ;;
              *) app="${filename%.apk}"; description='Android application.' ;;
            esac

            version='unknown'
            if [[ -x "$aapt" ]]; then
              version=$("$aapt" dump badging "$apk" 2>/dev/null | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" | head -n1)
              version=${version:-unknown}
            fi

            signer='Unavailable'
            if "$apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/signer.txt" 2>&1; then
              fingerprint=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/signer.txt" | head -n1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
              if [[ -n "$fingerprint" ]]; then
                signer="$fingerprint"
                signature='✅ Valid'
                if [[ -n "${EXPECTED_CERT_SHA256:-}" ]]; then
                  expected=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
                  if [[ "$fingerprint" != "$expected" ]]; then
                    signature='❌ Key mismatch'
                    failed=1
                  fi
                else
                  signature='✅ Valid (key not pinned)'
                fi
              else
                signature='❌ Fingerprint unavailable'
                failed=1
              fi
            else
              signature='❌ Invalid/unsigned'
              failed=1
            fi

            printf '| %s | `%s` | %s | `%s` | [⬇️ Download](https://github.com/%s/raw/refs/heads/%s/%s) |\n' \
              "$app" "$version" "$description" "$signer" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$apk" >> "$table"
            printf '| %s | `%s` | %s | `%s` |\n' "$filename" "$version" "$signature" "$signer" >> "$summary"
          done

          cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
            python3 - "$table" README.md <<'PY'
          import pathlib, sys
          table = pathlib.Path(sys.argv[1]).read_text().rstrip()
          path = pathlib.Path(sys.argv[2])
          text = path.read_text()
          start = '<!-- APK-TABLE-START -->'
          end = '<!-- APK-TABLE-END -->'
          if start not in text or end not in text:
              raise SystemExit('README table markers are missing')
          before, rest = text.split(start, 1)
          _, after = rest.split(end, 1)
          path.write_text(before + start + '\n' + table + '\n' + end + after)
          PY
            if [[ -n "$(git status --porcelain README.md)" ]]; then
              git config user.name github-actions[bot]
              git config user.email 41898282+github-actions[bot]@users.noreply.github.com
              git add README.md
              git commit -m 'chore: update APK versions and signing fingerprints'
              git push
            fi
          fi

          if (( failed )); then
            echo 'One or more APKs failed signature verification or trusted-key comparison.' >&2
            exit 1
          fi
