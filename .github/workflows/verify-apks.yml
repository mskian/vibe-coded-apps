name: Verify APKs and Update README

on:
  push:
    branches:
      - main
    paths:
      - "apks/**"
      - "README.md"
      - ".github/workflows/verify-apks.yml"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-and-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-update:
    name: Verify APKs and generate README table
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # --------------------------------------------------
      # 2. Set up Java
      # --------------------------------------------------
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # --------------------------------------------------
      # 3. Install Android SDK
      # --------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android Build Tools
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager "build-tools;35.0.0"

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          if [[ ! -x "$BUILD_TOOLS/apksigner" ]]; then
            echo "::error::apksigner was not installed"
            exit 1
          fi

          if [[ ! -x "$BUILD_TOOLS/aapt" ]]; then
            echo "::error::aapt was not installed"
            exit 1
          fi

          echo "$BUILD_TOOLS" >> "$GITHUB_PATH"

          apksigner version
          aapt version

      # --------------------------------------------------
      # 4. Verify APK signatures and generate README tables
      # --------------------------------------------------
      - name: Verify APKs and generate README table
        shell: bash
        env:
          EXPECTED_CERT_SHA256: ${{ vars.EXPECTED_CERT_SHA256 }}
        run: |
          set -euo pipefail

          shopt -s nullglob

          apks=(apks/*.apk)

          if (( ${#apks[@]} == 0 )); then
            echo "::error::No APK files found in apks/"
            exit 1
          fi

          SUMMARY="$RUNNER_TEMP/apk-summary.md"
          APK_TABLE="$RUNNER_TEMP/apk-table.md"
          VERIFY_TABLE="$RUNNER_TEMP/apk-verify-table.md"

          EXPECTED="${EXPECTED_CERT_SHA256:-}"
          EXPECTED="${EXPECTED//:/}"
          EXPECTED="${EXPECTED// /}"
          EXPECTED="${EXPECTED,,}"

          echo "| App | Description | Version | Signing certificate SHA-256 | Download |" > "$APK_TABLE"
          echo "|---|---|---|---|---|" >> "$APK_TABLE"

          echo "| APK | Version | Signature | SHA-256 signer certificate |" > "$VERIFY_TABLE"
          echo "|---|---|---|---|" >> "$VERIFY_TABLE"

          failed=0

          for apk in "${apks[@]}"; do

            filename="$(basename "$apk")"

            echo ""
            echo "========================================"
            echo "Verifying: $filename"
            echo "========================================"

            # --------------------------------------------------
            # 4.1 Determine app name and description
            # --------------------------------------------------

            case "$filename" in

              fithr-release-signed.apk)
                app="FitHR"
                description="Heart-rate companion and monitoring tools."
                ;;

              sancraft-release-signed.apk)
                app="SanCraft"
                description="Create and customize quote/kavithai images."
                ;;

              randomwords-release-signed.apk)
                app="Random Words"
                description="Discover a random word and its meaning."
                ;;

              tamilsms-release-signed.apk)
                app="Tamil SMS"
                description="Tamil words and message inspiration."
                ;;

              fitsteps-release-signed.apk)
                app="Fitsteps"
                description="Step tracking and activity tools."
                ;;

              sanfit-release-signed.apk)
                app="SanFit"
                description="Fitness and activity companion."
                ;;

              *)
                app="${filename%.apk}"
                description="Android application."
                ;;

            esac

            # --------------------------------------------------
            # 4.2 Extract version
            # --------------------------------------------------

            version="unknown"

            if aapt dump badging "$apk" > "$RUNNER_TEMP/badging.txt" 2>/dev/null; then
              extracted_version="$(
                sed -n "s/.*versionName='\([^']*\)'.*/\1/p" \
                  "$RUNNER_TEMP/badging.txt" |
                head -n 1
              )"

              if [[ -n "$extracted_version" ]]; then
                version="$extracted_version"
              fi
            fi

            # --------------------------------------------------
            # 4.3 Verify APK signature
            # --------------------------------------------------

            if ! apksigner verify --verbose --print-certs "$apk" \
                > "$RUNNER_TEMP/signer.txt" 2>&1; then

              cat "$RUNNER_TEMP/signer.txt"

              echo "::error::APK signature verification failed: $filename"

              failed=1
              continue
            fi

            # --------------------------------------------------
            # 4.4 Extract signer certificate SHA-256
            # --------------------------------------------------

            fingerprint="$(
              sed -n \
                's/^Signer #1 certificate SHA-256 digest: //p' \
                "$RUNNER_TEMP/signer.txt" |
              head -n 1 |
              tr -d ':' |
              tr '[:upper:]' '[:lower:]'
            )"

            if [[ -z "$fingerprint" ]]; then
              echo "::error::Could not extract certificate fingerprint: $filename"

              failed=1
              continue
            fi

            # --------------------------------------------------
            # 4.5 Compare expected certificate fingerprint
            # --------------------------------------------------

            if [[ -n "$EXPECTED" && "$fingerprint" != "$EXPECTED" ]]; then

              echo "::error::Certificate fingerprint mismatch: $filename"

              echo "Expected: $EXPECTED"
              echo "Actual:   $fingerprint"

              failed=1
              continue
            fi

            echo "Version: $version"
            echo "Signature: Valid"
            echo "Certificate SHA-256: $fingerprint"

            # --------------------------------------------------
            # 4.6 Generate download link
            # --------------------------------------------------

            download_url="https://github.com/${GITHUB_REPOSITORY}/raw/refs/heads/${GITHUB_REF_NAME}/${apk}"

            # --------------------------------------------------
            # 4.7 Generate README rows
            # --------------------------------------------------

            printf '| %s | %s | %s | `%s` | [⬇️ Download](%s) |\n' \
              "$app" \
              "$description" \
              "$version" \
              "$fingerprint" \
              "$download_url" >> "$APK_TABLE"

            printf '| %s | %s | ✅ Valid | `%s` |\n' \
              "$filename" \
              "$version" \
              "$fingerprint" >> "$VERIFY_TABLE"

          done

          # --------------------------------------------------
          # 4.8 Stop if any APK failed verification
          # --------------------------------------------------

          if (( failed != 0 )); then
            echo "::error::One or more APKs failed verification."
            exit 1
          fi

          # --------------------------------------------------
          # 4.9 Generate workflow summary
          # --------------------------------------------------

          {
            echo "## APK signature verification"
            echo ""
            cat "$VERIFY_TABLE"
          } > "$SUMMARY"

          cat "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"

          # --------------------------------------------------
          # 4.10 Update README tables
          # --------------------------------------------------

          python3 - "$APK_TABLE" "$VERIFY_TABLE" <<'PY'
          import pathlib
          import sys

          readme = pathlib.Path("README.md")

          apk_table = pathlib.Path(sys.argv[1]).read_text().rstrip()
          verify_table = pathlib.Path(sys.argv[2]).read_text().rstrip()

          text = readme.read_text()

          def replace_section(text, start, end, content):
              if start not in text or end not in text:
                  raise SystemExit(
                      f"README markers missing: {start} / {end}"
                  )

              before, remainder = text.split(start, 1)
              _, after = remainder.split(end, 1)

              return (
                  before
                  + start
                  + "\n"
                  + content
                  + "\n"
                  + end
                  + after
              )

          text = replace_section(
              text,
              "<!-- APK-TABLE-START -->",
              "<!-- APK-TABLE-END -->",
              apk_table,
          )

          text = replace_section(
              text,
              "<!-- APK-VERIFY-START -->",
              "<!-- APK-VERIFY-END -->",
              verify_table,
          )

          readme.write_text(text)
          PY

      # --------------------------------------------------
      # 5. Commit README changes
      # --------------------------------------------------
      - name: Commit README changes
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "README is already up to date."
            exit 0
          fi

          git commit -m "docs: update verified APK download table"

          git push origin "HEAD:${GITHUB_REF_NAME}"
