name: Verify APKs and Update README

on:
  push:
    branches:
      - main
    paths:
      - "apks/**"
      - "app-descriptions.json"
      - "scripts/update_readme.py"
      - ".github/workflows/verify-apks.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build tools
        run: sdkmanager "build-tools;36.0.0"

      - name: Verify APKs and update README
        env:
          BUILD_TOOLS_VERSION: "36.0.0"
          EXPECTED_CERT_SHA256: ${{ vars.EXPECTED_CERT_SHA256 }}
        run: python3 scripts/update_readme.py

      - name: Commit README changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "README is already up to date."
          else
            git commit -m "Update verified APK list"
            git push
          fi
