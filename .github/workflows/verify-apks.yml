name: Verify APKs and Update README

on:
  push:
    branches:
      - main
    paths:
      - "apks/**"
      - "app-descriptions.json"
      - ".github/workflows/verify-apks.yml"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-and-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-update:
    name: Verify APKs and generate README list
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 2. Set up Java
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # 3. Set up Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # 4. Install Android Build Tools
      - name: Install Android Build Tools
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install "build-tools;35.0.0"

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          AAPT="$BUILD_TOOLS/aapt"

          if [[ ! -x "$APKSIGNER" ]]; then
            echo "::error::apksigner was not installed"
            exit 1
          fi

          if [[ ! -x "$AAPT" ]]; then
            echo "::error::aapt was not installed"
            exit 1
          fi

          echo "APKSIGNER=$APKSIGNER" >> "$GITHUB_ENV"
          echo "AAPT=$AAPT" >> "$GITHUB_ENV"

          "$APKSIGNER" version
          "$AAPT" version

      # 5. Validate app descriptions
      - name: Validate app descriptions
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f app-descriptions.json ]]; then
            echo "::error::app-descriptions.json was not found"
            exit 1
          fi

          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("app-descriptions.json")

          try:
              data = json.loads(path.read_text(encoding="utf-8"))
          except json.JSONDecodeError as error:
              raise SystemExit(f"Invalid app-descriptions.json: {error}")

          if not isinstance(data, dict):
              raise SystemExit("app-descriptions.json must contain a JSON object")

          for app, description in data.items():
              if not isinstance(app, str) or not isinstance(description, str):
                  raise SystemExit(
                      "Each app description must be a string key and string value"
                  )
              if not description.strip():
                  raise SystemExit(f"Description is empty for app: {app}")

          print(f"Validated descriptions for {len(data)} apps.")
          PY

      # 6. Verify APK signatures and generate README list
      - name: Verify APKs and generate README list
        shell: bash
        env:
          EXPECTED_CERT_SHA256: ${{ vars.EXPECTED_CERT_SHA256 }}
        run: |
          set -euo pipefail

          shopt -s nullglob
          apks=(apks/*.apk)

          if (( ${#apks[@]} == 0 )); then
            echo "::error::No APK files found in apks/"
            exit 1
          fi

          APK_LIST="$RUNNER_TEMP/apk-list.md"
          SUMMARY="$RUNNER_TEMP/apk-summary.md"
          METADATA="$RUNNER_TEMP/apk-metadata.json"

          EXPECTED="${EXPECTED_CERT_SHA256:-}"
          EXPECTED="${EXPECTED//:/}"
          EXPECTED="${EXPECTED// /}"
          EXPECTED="${EXPECTED,,}"

          printf '[]\n' > "$METADATA"
          failed=0

          for apk in "${apks[@]}"; do
            filename="$(basename "$apk")"

            echo ""
            echo "========================================"
            echo "Verifying: $filename"
            echo "========================================"

            # Map APK filename to app name
            case "$filename" in
              fithr-release-signed.apk)
                app="FitHR"
                ;;
              sancraft-release-signed.apk)
                app="SanCraft"
                ;;
              randomwords-release-signed.apk)
                app="Random Words"
                ;;
              tamilsms-release-signed.apk)
                app="Tamil SMS"
                ;;
              fitsteps-release-signed.apk)
                app="Fitsteps"
                ;;
              sanfit-release-signed.apk)
                app="SanFit"
                ;;
              *)
                app="${filename%.apk}"
                ;;
            esac

            # Load description from app-descriptions.json
            description="$(
              python3 - "$app" <<'PY'
          import json
          import sys
          from pathlib import Path

          app = sys.argv[1]
          descriptions = json.loads(
              Path("app-descriptions.json").read_text(encoding="utf-8")
          )

          print(descriptions.get(app, "Android application."))
          PY
            )"

            # Extract APK version
            version="unknown"

            if "$AAPT" dump badging "$apk" \
                > "$RUNNER_TEMP/badging.txt" 2>/dev/null; then

              extracted_version="$(
                sed -n \
                  "s/.*versionName='\([^']*\)'.*/\1/p" \
                  "$RUNNER_TEMP/badging.txt" |
                head -n 1
              )"

              if [[ -n "$extracted_version" ]]; then
                version="$extracted_version"
              fi
            fi

            # Verify APK signature
            signer_file="$RUNNER_TEMP/signer.txt"

            if ! "$APKSIGNER" verify \
                --verbose \
                --print-certs \
                "$apk" > "$signer_file" 2>&1; then

              cat "$signer_file"
              echo "::error::APK signature verification failed: $filename"

              failed=1
              continue
            fi

            # Extract SHA-256 certificate fingerprint
            fingerprint="$(
              sed -n \
                's/^Signer #1 certificate SHA-256 digest: //p' \
                "$signer_file" |
              head -n 1 |
              tr -d ':' |
              tr '[:upper:]' '[:lower:]'
            )"

            if [[ -z "$fingerprint" ]]; then
              echo "::error::Could not extract certificate fingerprint: $filename"
              failed=1
              continue
            fi

            # Optional certificate pinning
            if [[ -n "$EXPECTED" && "$fingerprint" != "$EXPECTED" ]]; then
              echo "::error::Certificate fingerprint mismatch: $filename"
              echo "Expected: $EXPECTED"
              echo "Actual:   $fingerprint"

              failed=1
              continue
            fi

            download_url="https://github.com/${GITHUB_REPOSITORY}/raw/${GITHUB_REF_NAME}/${apk}"

            echo "App: $app"
            echo "Description: $description"
            echo "Version: $version"
            echo "Signature: Valid"
            echo "Certificate SHA-256: $fingerprint"

            # Store verified app metadata for README and summary generation
            python3 - "$METADATA" "$app" "$description" "$version" "$fingerprint" "$download_url" <<'PY'
          import json
          import sys
          from pathlib import Path

          metadata_path = Path(sys.argv[1])
          app, description, version, fingerprint, download_url = sys.argv[2:]

          entries = json.loads(metadata_path.read_text(encoding="utf-8"))
          entries.append({
              "app": app,
              "description": description,
              "version": version,
              "fingerprint": fingerprint,
              "download_url": download_url
          })

          metadata_path.write_text(
              json.dumps(entries, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )
          PY
          done

          # Stop if any APK failed verification
          if (( failed != 0 )); then
            echo "::error::One or more APKs failed verification."
            exit 1
          fi

          # Generate README list and Actions summary
          python3 - "$METADATA" "$APK_LIST" "$SUMMARY" <<'PY'
          import json
          import sys
          from pathlib import Path

          metadata_path = Path(sys.argv[1])
          list_path = Path(sys.argv[2])
          summary_path = Path(sys.argv[3])

          apps = json.loads(metadata_path.read_text(encoding="utf-8"))

          readme_lines = []
          summary_lines = [
              "## APK signature verification",
              "",
              "All APK signatures are valid.",
              "",
              "| APK | Version | Certificate SHA-256 |",
              "|---|---|---|"
          ]

          for item in apps:
              readme_lines.extend([
                  f"### {item['app']}",
                  "",
                  item["description"],
                  "",
                  f"- **Version:** `{item['version']}`",
                  f"- **Signing certificate SHA-256:** `{item['fingerprint']}`",
                  f"- **Download:** [⬇️ Download APK]({item['download_url']})",
                  ""
              ])

              summary_lines.append(
                  f"| {item['app']} | {item['version']} | "
                  f"`{item['fingerprint']}` |"
              )

          list_path.write_text("\n".join(readme_lines).rstrip() + "\n", encoding="utf-8")
          summary_path.write_text("\n".join(summary_lines) + "\n", encoding="utf-8")
          PY

          cat "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"

          # Update README list between markers
          python3 - "$APK_LIST" <<'PY'
          import pathlib
          import sys

          readme = pathlib.Path("README.md")
          app_list = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8").rstrip()
          text = readme.read_text(encoding="utf-8")

          start = "<!-- APK-TABLE-START -->"
          end = "<!-- APK-TABLE-END -->"

          if start not in text or end not in text:
              raise SystemExit(
                  "README is missing APK-TABLE-START or APK-TABLE-END markers"
              )

          before, remainder = text.split(start, 1)
          _, after = remainder.split(end, 1)

          updated = (
              before
              + start
              + "\n\n"
              + app_list
              + "\n\n"
              + end
              + after
          )

          readme.write_text(updated, encoding="utf-8")
          PY

      # 7. Commit README changes
      - name: Commit README changes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "README is already up to date."
            exit 0
          fi

          git commit -m "docs: update verified APK download list"
          git push origin "HEAD:${GITHUB_REF_NAME}"
