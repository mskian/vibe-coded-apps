name: Verify APKs and Update README

on:
  push:
    branches:
      - main
    paths:
      - "apks/**"
      - ".github/workflows/verify-apks.yml"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-and-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-update:
    name: Verify APKs and generate README table
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # --------------------------------------------------
      # 2. Set up Java
      # --------------------------------------------------
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # --------------------------------------------------
      # 3. Set up Android SDK
      # --------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # --------------------------------------------------
      # 4. Install Android Build Tools
      # --------------------------------------------------
      - name: Install Android Build Tools
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install "build-tools;35.0.0"

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          AAPT="$BUILD_TOOLS/aapt"

          if [[ ! -x "$APKSIGNER" ]]; then
            echo "::error::apksigner was not installed"
            exit 1
          fi

          if [[ ! -x "$AAPT" ]]; then
            echo "::error::aapt was not installed"
            exit 1
          fi

          echo "APKSIGNER=$APKSIGNER" >> "$GITHUB_ENV"
          echo "AAPT=$AAPT" >> "$GITHUB_ENV"

          "$APKSIGNER" version
          "$AAPT" version

      # --------------------------------------------------
      # 5. Verify APK signatures and generate README table
      # --------------------------------------------------
      - name: Verify APKs and generate README table
        shell: bash
        env:
          EXPECTED_CERT_SHA256: ${{ vars.EXPECTED_CERT_SHA256 }}
        run: |
          set -euo pipefail

          shopt -s nullglob

          apks=(apks/*.apk)

          if (( ${#apks[@]} == 0 )); then
            echo "::error::No APK files found in apks/"
            exit 1
          fi

          APK_TABLE="$RUNNER_TEMP/apk-table.md"
          SUMMARY="$RUNNER_TEMP/apk-summary.md"

          EXPECTED="${EXPECTED_CERT_SHA256:-}"
          EXPECTED="${EXPECTED//:/}"
          EXPECTED="${EXPECTED// /}"
          EXPECTED="${EXPECTED,,}"

          echo "| App | Description | Version | Signing certificate SHA-256 | Download |" > "$APK_TABLE"
          echo "|---|---|---|---|---|" >> "$APK_TABLE"

          failed=0

          for apk in "${apks[@]}"; do
            filename="$(basename "$apk")"

            echo ""
            echo "========================================"
            echo "Verifying: $filename"
            echo "========================================"

            # ----------------------------------------------
            # App metadata
            # ----------------------------------------------
            case "$filename" in
              fithr-release-signed.apk)
                app="FitHR"
                description="Heart-rate companion and monitoring tools."
                ;;
              sancraft-release-signed.apk)
                app="SanCraft"
                description="Create and customize quote/kavithai images."
                ;;
              randomwords-release-signed.apk)
                app="Random Words"
                description="Discover a random word and its meaning."
                ;;
              tamilsms-release-signed.apk)
                app="Tamil SMS"
                description="Tamil words and message inspiration."
                ;;
              fitsteps-release-signed.apk)
                app="Fitsteps"
                description="Step tracking and activity tools."
                ;;
              sanfit-release-signed.apk)
                app="SanFit"
                description="Fitness and activity companion."
                ;;
              *)
                app="${filename%.apk}"
                description="Android application."
                ;;
            esac

            # ----------------------------------------------
            # Extract APK version
            # ----------------------------------------------
            version="unknown"

            if "$AAPT" dump badging "$apk" \
                > "$RUNNER_TEMP/badging.txt" 2>/dev/null; then

              extracted_version="$(
                sed -n \
                  "s/.*versionName='\([^']*\)'.*/\1/p" \
                  "$RUNNER_TEMP/badging.txt" |
                head -n 1
              )"

              if [[ -n "$extracted_version" ]]; then
                version="$extracted_version"
              fi
            fi

            # ----------------------------------------------
            # Verify APK signature
            # ----------------------------------------------
            signer_file="$RUNNER_TEMP/signer.txt"

            if ! "$APKSIGNER" verify \
                --verbose \
                --print-certs \
                "$apk" > "$signer_file" 2>&1; then

              cat "$signer_file"

              echo "::error::APK signature verification failed: $filename"

              failed=1
              continue
            fi

            # ----------------------------------------------
            # Extract SHA-256 certificate fingerprint
            # ----------------------------------------------
            fingerprint="$(
              sed -n \
                's/^Signer #1 certificate SHA-256 digest: //p' \
                "$signer_file" |
              head -n 1 |
              tr -d ':' |
              tr '[:upper:]' '[:lower:]'
            )"

            if [[ -z "$fingerprint" ]]; then
              echo "::error::Could not extract certificate fingerprint: $filename"

              failed=1
              continue
            fi

            # ----------------------------------------------
            # Optional certificate pinning
            # ----------------------------------------------
            if [[ -n "$EXPECTED" && "$fingerprint" != "$EXPECTED" ]]; then
              echo "::error::Certificate fingerprint mismatch: $filename"

              echo "Expected: $EXPECTED"
              echo "Actual:   $fingerprint"

              failed=1
              continue
            fi

            echo "Version: $version"
            echo "Signature: Valid"
            echo "Certificate SHA-256: $fingerprint"

            # ----------------------------------------------
            # Generate download link
            # ----------------------------------------------
            download_url="https://github.com/${GITHUB_REPOSITORY}/raw/${GITHUB_REF_NAME}/${apk}"

            # ----------------------------------------------
            # Generate README table row
            # ----------------------------------------------
            printf '| %s | %s | %s | `%s` | [⬇️ Download](%s) |\n' \
              "$app" \
              "$description" \
              "$version" \
              "$fingerprint" \
              "$download_url" >> "$APK_TABLE"

          done

          # ----------------------------------------------
          # Stop if any APK failed verification
          # ----------------------------------------------
          if (( failed != 0 )); then
            echo "::error::One or more APKs failed verification."
            exit 1
          fi

          # ----------------------------------------------
          # Generate GitHub Actions summary
          # ----------------------------------------------
          {
            echo "## APK signature verification"
            echo ""
            echo "All APK signatures are valid."
            echo ""
            echo "| APK | Version | Certificate SHA-256 |"
            echo "|---|---|---|"

            for apk in "${apks[@]}"; do
              filename="$(basename "$apk")"

              version="$(
                "$AAPT" dump badging "$apk" 2>/dev/null |
                sed -n "s/.*versionName='\([^']*\)'.*/\1/p" |
                head -n 1
              )"

              fingerprint="$(
                "$APKSIGNER" verify --print-certs "$apk" 2>/dev/null |
                sed -n \
                  's/^Signer #1 certificate SHA-256 digest: //p' |
                head -n 1
              )"

              echo "| $filename | ${version:-unknown} | \`$fingerprint\` |"
            done
          } > "$SUMMARY"

          cat "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"

          # ----------------------------------------------
          # Update README table
          # ----------------------------------------------
          python3 - "$APK_TABLE" <<'PY'
          import pathlib
          import sys

          readme = pathlib.Path("README.md")
          table = pathlib.Path(sys.argv[1]).read_text().rstrip()

          text = readme.read_text()

          start = "<!-- APK-TABLE-START -->"
          end = "<!-- APK-TABLE-END -->"

          if start not in text or end not in text:
              raise SystemExit(
                  "README is missing APK-TABLE-START or APK-TABLE-END markers"
              )

          before, remainder = text.split(start, 1)
          _, after = remainder.split(end, 1)

          updated = (
              before
              + start
              + "\n"
              + table
              + "\n"
              + end
              + after
          )

          readme.write_text(updated)
          PY

      # --------------------------------------------------
      # 6. Commit README changes
      # --------------------------------------------------
      - name: Commit README changes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "README is already up to date."
            exit 0
          fi

          git commit -m "docs: update verified APK download table"

          git push origin "HEAD:${GITHUB_REF_NAME}"
